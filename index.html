<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emotion Battle v3</title><link rel="stylesheet" href="style.css"><script src="game.js" defer></script></head><body><main class="wrap"><header><div><h1>EMOTION BATTLE</h1><p>Speed-based turn combat · Prototype v4</p></div><button class="ghost" id="restart">↻ Restart</button></header><section class="strip"><span id="round"></span><span id="turn"></span></section><section class="panel event-panel"><h2>최근 행동 <small>LIVE EVENTS</small></h2><div id="event" aria-live="polite"></div><details><summary>전체 전투 기록</summary><div id="history"></div></details></section><section class="panel"><h2>적 <small>ENEMIES</small></h2><div id="enemies" class="units"></div></section><section class="panel"><h2>아군 <small>PARTY</small></h2><div id="party" class="units"></div></section><section class="panel focus"><h2>현재 턴 <small>CURRENT TURN</small></h2><div id="current"></div><div id="actions"></div><div id="targetBox"></div><div id="hint"></div></section><footer>감정 상성: 기쁨 → 분노 → 슬픔 → 기쁨 · 화살표 방향이 유리합니다.</footer></main></body></html>
